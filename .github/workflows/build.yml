name: Build generated lists

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "allowlist.txt"
      - "scripts/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: python scripts/validate.py

      - name: Build lists
        run: python scripts/build.py

      - name: Commit generated outputs
        run: |
          if git diff --quiet -- osfilter.txt hosts.txt lists/; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osfilter.txt hosts.txt lists/
          git commit -m "build: regenerate filter outputs [skip ci]"
          git push

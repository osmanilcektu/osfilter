name: Build and publish lists

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "allowlist.txt"
      - "scripts/build.py"
      - "scripts/validate.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osfilter-dist-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local OSFilter sources
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build all tiers
        run: python scripts/build.py

      - name: Show build statistics
        run: cat stats.json

      - name: Stage distribution tree
        run: |
          DIST="$RUNNER_TEMP/osfilter-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST/lists" "$DIST/LICENSES"

          cp osfilter.txt hosts.txt domains.txt stats.json SHA256SUMS "$DIST/"
          cp lists/*.txt "$DIST/lists/"
          cp LICENSE "$DIST/"
          cp THIRD_PARTY_NOTICES.md "$DIST/"
          cp LICENSES/GPL-3.0-only.txt "$DIST/LICENSES/"
          cp LICENSES/ODbL-1.0.txt "$DIST/LICENSES/"
          cp LICENSES/UNLICENSE.txt "$DIST/LICENSES/"

          cat > "$DIST/README.md" <<'EOF'
          # OSFilter generated distribution

          This branch is generated automatically. Do not edit it manually.

          Source repository:
          https://github.com/osmanilcektu/osfilter

          Main aliases are the Standard tier:
          - osfilter.txt — Adblock
          - hosts.txt — hosts
          - domains.txt — plain domains

          Additional tiers are under lists/:
          - Core TR
          - Lite
          - Pro
          - Ultra

          See stats.json for current entry counts, SHA256SUMS for integrity,
          and THIRD_PARTY_NOTICES.md for attribution.
          EOF

      - name: Publish orphan dist branch
        run: |
          DIST="$RUNNER_TEMP/osfilter-dist"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan dist-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$DIST"/. .

          git add -f .
          git commit -m "build: publish OSFilter distribution"
          git push --force origin HEAD:dist

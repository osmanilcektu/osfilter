name: Build and publish lists

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "allowlist.txt"
      - "scripts/build.py"
      - "scripts/regional.py"
      - "scripts/check_release.py"
      - "scripts/validate.py"
      - "tests/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osfilter-dist-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local OSFilter sources
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build all tiers
        run: python scripts/build.py

      - name: Show build statistics
        run: cat stats.json

      - name: Guard against sudden upstream changes
        run: |
          if git fetch --quiet origin dist:refs/remotes/origin/dist 2>/dev/null; then
            PREVIOUS="$RUNNER_TEMP/osfilter-previous"
            mkdir -p "$PREVIOUS/lists"
            git show origin/dist:domains.txt > "$PREVIOUS/domains.txt"
            git show origin/dist:lists/osfilter-ultra-domains.txt > "$PREVIOUS/lists/osfilter-ultra-domains.txt"
            python scripts/check_release.py --previous-dir "$PREVIOUS"
          else
            echo "No previous dist branch: first publication."
          fi

      - name: Stage distribution tree
        run: |
          DIST="$RUNNER_TEMP/osfilter-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST/lists" "$DIST/LICENSES"

          cp osfilter.txt hosts.txt domains.txt dnsmasq.conf unbound.conf rpz.zone              stats.json upstream-lock.json SHA256SUMS "$DIST/"
          cp lists/* "$DIST/lists/"
          cp LICENSE "$DIST/"
          cp THIRD_PARTY_NOTICES.md "$DIST/"
          cp LICENSES/GPL-3.0-only.txt "$DIST/LICENSES/"
          cp LICENSES/ODbL-1.0.txt "$DIST/LICENSES/"
          cp LICENSES/UNLICENSE.txt "$DIST/LICENSES/"

          cat > "$DIST/README.md" <<'EOF'
          # OSFilter generated distribution

          This branch is generated automatically. Do not edit it manually.

          Source repository:
          https://github.com/osmanilcektu/osfilter

          Main aliases are the Standard tier:
          - osfilter.txt — Adblock
          - hosts.txt — hosts
          - domains.txt — plain domains
          - dnsmasq.conf — dnsmasq 2.86+
          - unbound.conf — Unbound local-zone
          - rpz.zone — BIND RPZ

          Additional tiers are under lists/:
          - Core TR
          - Lite
          - Pro
          - Ultra

          See:
          - stats.json for current entry counts
          - upstream-lock.json for upstream SHA-256/size provenance
          - SHA256SUMS for generated-file integrity
          - THIRD_PARTY_NOTICES.md for attribution
          EOF

      - name: Check whether distribution changed
        id: changes
        run: |
          DIST="$RUNNER_TEMP/osfilter-dist"
          CHANGED=true

          if git fetch --quiet origin dist:refs/remotes/origin/dist 2>/dev/null; then
            if git show origin/dist:SHA256SUMS > "$RUNNER_TEMP/old-SHA256SUMS" 2>/dev/null; then
              if cmp -s "$RUNNER_TEMP/old-SHA256SUMS" "$DIST/SHA256SUMS"; then
                CHANGED=false
              fi
            fi
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Distribution changed: $CHANGED"

      - name: Publish orphan dist branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          DIST="$RUNNER_TEMP/osfilter-dist"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan dist-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$DIST"/. .

          git add -f .
          git commit -m "build: publish OSFilter distribution"
          git push --force origin HEAD:dist

      - name: No distribution changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "Generated output is identical to current dist branch; publish skipped."

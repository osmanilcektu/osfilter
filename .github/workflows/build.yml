name: Build generated lists

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "allowlist.txt"
      - "scripts/build.py"
      - "scripts/validate.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osfilter-build-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local OSFilter sources
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build all tiers
        run: python scripts/build.py

      - name: Show build statistics
        run: cat stats.json

      - name: Commit generated outputs
        run: |
          if git diff --quiet -- osfilter.txt hosts.txt domains.txt stats.json lists/; then
            echo "Generated outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osfilter.txt hosts.txt domains.txt stats.json lists/
          git commit -m "build: refresh OSFilter tiers [skip ci]"

          # The repository may have moved while this build was downloading
          # upstream lists. Rebase the generated commit onto the latest main.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

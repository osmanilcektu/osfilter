name: Discover TR candidates

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration
        run: python scripts/validate.py

      - name: Discover Turkish candidates
        run: python scripts/discover_tr_candidates.py

      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: osfilter-tr-candidates
          path: artifacts/tr-candidates.csv
          retention-days: 30
